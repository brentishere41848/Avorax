[package]
name = "zentor_guard_service"
version = "0.1.0"
edition = "2021"

[features]
default = []
compat_clamav = []
compat_yara = []

[dependencies]
anyhow = "1.0"
avorax_platform_security = { path = "../avorax_platform_security" }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zentor_native_engine = { path = "../zentor_native_engine" }
tempfile = "3.14"
uuid = { version = "1.11", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]

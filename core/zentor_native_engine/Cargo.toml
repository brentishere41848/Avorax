[package]
name = "zentor_native_engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zentor-signature-compiler"
path = "src/bin/zentor-signature-compiler.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4", "serde"] }
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
avorax_platform_security = { path = "../avorax_platform_security" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3.14"
